<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Crown Costumes</title>
  <link href="estilos.css" rel="stylesheet">

  <style>
    .mensagem-login {
      color:  rgb(250, 215, 112);
      margin-bottom: 15px;
      text-align: left;
      font-size: 14px;
    }

    .mensagem-login ul {
      padding-left: 20px;
    }
  </style>
</head>

<body class="pagina-form">

  <div class="login-container">

    <form
      class="login-box"
      id="formLogin"
      action="paginainicial.html"
      method="get"
    >

      <h1>Login</h1>

      <div id="mensagemLogin" class="mensagem-login"></div>

      <label for="usuario">
        Usuário:
      </label>

      <input
        type="text"
        id="usuario"
        name="usuario"
      >

      <label for="senha">
        Senha:
      </label>

      <input
        type="password"
        id="senha"
        name="senha"
      >

      <button type="submit">
        Entrar
      </button>

    </form>

  </div>

  <script>

    const formLogin = document.getElementById("formLogin");

    formLogin.addEventListener("submit", function(event) {

      event.preventDefault();

      const usuario = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value.trim();

      const mensagem = document.getElementById("mensagemLogin");

      let faltando = [];

      if (usuario === "") {
        faltando.push("Falta preencher o usuário.");
      }

      if (senha === "") {
        faltando.push("Falta preencher a senha.");
      }

      if (faltando.length > 0) {

        mensagem.innerHTML =
          "<strong>Não foi possível realizar o login!</strong><ul><li>" +
          faltando.join("</li><li>") +
          "</li></ul>";

        return;

      }

      mensagem.innerHTML = "";

      // Continua para a página inicial
      formLogin.submit();

    });

  </script>

</body>
</html>
