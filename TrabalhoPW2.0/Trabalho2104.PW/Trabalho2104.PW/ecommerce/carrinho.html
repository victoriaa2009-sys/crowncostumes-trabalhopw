
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <title>Crown Costumes</title>
  <link href="estilos.css" rel="stylesheet">
  <meta charset="UTF-8">
</head>

<body>
  
  <div class="topo">
    <form class="barra" action="carrinho.html">

      <div class="marca">
        <img src="fotos/logopreta.png" class="logopreta" alt="logo preta">
        <a href="paginainicial.html" class="nome-barra">Crown Costumes</a>
      </div>
      <div>
            <span class="busca-container">
              <input type="text" placeholder="Buscar fantasias..." name="busca" id="campo-busca" autocomplete="off">
              <input type="submit" value="Buscar" class="btn-busca">
              <div id="sugestoes"></div>
            </span>
      </div>
      <div class="acoes">
        <button formaction="login.html">Login</button>
        <button formaction="cadastro.html">Cadastro</button>
        <button formaction="carrinho.html">Carrinho</button>
        <button formaction="sobre.html">Sobre</button>
      </div>
    </form>
</div>

<section>
  <h2 class="carrinho-titulo">Seu Carrinho</h2>

  <table class="carrinho">
    <tr>
      <th>Produto</th>
      <th>Nome</th>
      <th>Qtd</th>
      <th>Preço</th>
      <th>Total</th>
    </tr>

    <tr>
      <td><img src="fotos/femininas/edward.jpeg" width="60" alt="Edward"></td>
      <td>Edward, de Edward Mãos de Tesoura</td>
      <td>1</td>
      <td>R$ 148,98</td>
      <td>R$ 148,98</td>
    </tr>

    <tr>
      <td><img src="fotos/masculinas/anos80.jpg" width="60" alt="David Bowie"></td>
      <td>David Bowie</td>
      <td>1</td>
      <td>R$ 148,98</td>
      <td>R$ 148,98</td>
    </tr>

    <tr>
      <td><img src="fotos/kids/palhacokids.webp" width="60" alt="Palhaço Infantil"></td>
      <td>Palhaço Infantil</td>
      <td>1</td>
      <td>R$ 148,98</td>
      <td>R$ 148,98</td>
    </tr>
  </table>

  <div class="resumo">
    <h3>Resumo do pedido</h3>

    <label>CEP:</label>
    <input type="text" placeholder="Digite seu CEP">

    <p>Frete: R$ 30,00</p>
    <h2>Total: R$ 476,94</h2>

    <button class="btn">Finalizar Compra</button>
  </div>
</section>

<footer>
  <p>© 2026 Crown Costume</p>
</footer>

<script>

  const produtos = [
    { nome: "Mickey Mouse", pagina: "mickeykids.html" },
    { nome: "Harry Potter", pagina: "harrypotter.html" },
    { nome: "Maskara", pagina: "maskara.html" },
    { nome: "Alice, de Alice no País das Maravilhas", pagina: "alice.html" },
    { nome: "David Bowie", pagina: "davidbowie.html" },
    { nome: "Chapéu de Bruxa", pagina: "acessorios6.html" },

    { nome: "Bela, de Bela e a Fera", pagina: "belaeafera.html" },
    { nome: "Mágica", pagina: "magica.html" },
    { nome: "Edward, de Edward Mãos de Tesoura", pagina: "edwardfem.html" },
    { nome: "Super Mario FEM", pagina: "mariofem.html" },

    { nome: "Pânico", pagina: "panico.html" },
    { nome: "Pikachu", pagina: "pikachu.html" },
    { nome: "Luigi", pagina: "luigi.html" },
    { nome: "Barney", pagina: "barney.html" },

    { nome: "Minions", pagina: "acessorios1.html" },
    { nome: "Espião", pagina: "acessorios2.html" },
    { nome: "Mágico", pagina: "acessorios4.html" },
    { nome: "Peruca verde e amarelo", pagina: "perucaverde.html" },

    { nome: "Palhaço", pagina: "palhacokids.html" },
    { nome: "Branca de Neve", pagina: "brancadenevekids.html" }
  ];


  const campoBusca = document.getElementById("campo-busca");
  const sugestoes = document.getElementById("sugestoes");


  campoBusca.addEventListener("input", function() {

    const texto = campoBusca.value.toLowerCase().trim();

    sugestoes.innerHTML = "";

    if (texto === "") {
      return;
    }


    const resultados = produtos.filter(function(produto) {

      return produto.nome.toLowerCase().includes(texto);

    });


    resultados.forEach(function(produto) {

      const sugestao = document.createElement("div");

      sugestao.textContent = produto.nome;

      sugestao.classList.add("sugestao");


      sugestao.addEventListener("click", function() {

        window.location.href = produto.pagina;

      });


      sugestoes.appendChild(sugestao);

    });

  });

</script>

</body>
</html>
