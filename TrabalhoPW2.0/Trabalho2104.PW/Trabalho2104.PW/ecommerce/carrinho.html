<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Crown Costumes</title>
    <link href="estilos.css" rel="stylesheet">
</head>

<body>

<div class="topo">

    <form class="barra" action="carrinho.html">

        <div class="marca">

            <img
                src="fotos/logopreta.png"
                class="logopreta"
                alt="logo preta"
            >

            <a
                href="paginainicial.html"
                class="nome-barra"
            >
                Crown Costumes
            </a>

        </div>

        <div>

            <span class="busca-container">

                <input
                    type="text"
                    placeholder="Buscar fantasias..."
                    name="busca"
                    id="campo-busca"
                    autocomplete="off"
                >

                <input
                    type="submit"
                    value="Buscar"
                    class="btn-busca"
                >

                <div id="sugestoes"></div>

            </span>

        </div>

        <div class="acoes">

            <button
                type="submit"
                formaction="login.html"
            >
                Login
            </button>

            <button
                type="submit"
                formaction="cadastro.html"
            >
                Cadastro
            </button>

            <button
                type="submit"
                formaction="carrinho.html"
            >
                Carrinho
            </button>

            <button
                type="submit"
                formaction="sobre.html"
            >
                Sobre
            </button>

        </div>

    </form>

</div>


<section>

    <h2 class="carrinho-titulo">
        Seu Carrinho
    </h2>


    <table class="carrinho">

        <thead>

            <tr>

                <th>Produto</th>

                <th>Nome</th>

                <th>Quantidade</th>

                <th>Preço</th>

                <th>Total</th>

                <th>Ação</th>

            </tr>

        </thead>


        <tbody id="listaCarrinho">
        </tbody>

    </table>


    <div class="resumo">

        <h3>
            Resumo do pedido
        </h3>


        <label for="cep">
            CEP:
        </label>

        <input
            type="text"
            id="cep"
            placeholder="Digite seu CEP"
            maxlength="9"
        >


        <p
            id="mensagemFrete"
            class="mensagem-login"
        ></p>


        <p>
            Frete:

            <span id="frete">
                R$ 0,00
            </span>
        </p>


        <p id="desconto">
            Desconto: R$ 0,00
        </p>


        <h2>

            Total:

            <span id="totalCarrinho">
                R$ 0,00
            </span>

        </h2>


        <button
            class="btn"
            id="calcularFrete"
            type="button"
        >
            Calcular Frete
        </button>


        <button
            class="btn"
            id="finalizarCompra"
            type="button"
        >
            Finalizar Compra
        </button>


        <div class="cupom">

            <label for="cupom">
                Cupom de desconto:
            </label>


            <input
                type="text"
                id="cupom"
                placeholder="Digite seu cupom"
            >


            <button
                type="button"
                id="aplicarCupom"
            >
                Aplicar
            </button>


            <div id="mensagemCupom"></div>

        </div>

    </div>

</section>


<footer>

    <p>
        © 2026 Crown Costumes
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
